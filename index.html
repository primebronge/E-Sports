<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Teams & Theme</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; padding: 20px; }
        .header { 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #fca311; padding-bottom: 10px; margin-bottom: 20px; 
        }
        .header h2 { margin: 0; font-size: 20px; }
        .header-btns { display: flex; gap: 15px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #fca311; transition: 0.3s; }
        .icon-btn:hover { transform: scale(1.1); opacity: 0.8; }

        /* Team List Style */
        .team-card {
            background: #1e1e1e; display: flex; align-items: center;
            padding: 12px; margin-bottom: 10px; border-radius: 10px;
            cursor: pointer; transition: 0.3s; border: 1px solid #333;
        }
        .team-card:hover { border-color: #fca311; transform: translateY(-2px); }
        .team-card img { width: 45px; height: 45px; border-radius: 5px; margin-right: 15px; object-fit: cover; }
        .team-info { flex-grow: 1; }
        .team-info h3 { margin: 0; font-size: 17px; }
        .team-info p { margin: 3px 0 0; font-size: 13px; color: #fca311; font-weight: bold; }

        /* Floating Button */
        .fab {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: #fca311; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-size: 30px;
            color: black; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Modal Style */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: #222; padding: 20px; border-radius: 15px; width: 95%; max-width: 420px; 
            border: 1px solid #444; max-height: 90vh; overflow-y: auto;
        }
        
        .input-row { display: flex; align-items: center; margin-bottom: 12px; }
        .input-row label { width: 110px; font-size: 14px; color: #fca311; font-weight: bold; }
        .input-row input { flex: 1; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 5px; outline: none; }
        
        /* Upload Wrapper */
        .upload-container { flex: 1; display: flex; gap: 5px; }
        .upload-btn { background: #333; border: 1px solid #555; color: #fca311; padding: 0 12px; border-radius: 5px; cursor: pointer; font-size: 18px; display: flex; align-items: center; }
        .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .section-title { font-size: 14px; color: #888; margin: 15px 0 10px; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 5px; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .action-btns { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-save { background: #fca311; color: black; }
        .btn-cancel { background: #444; color: white; }
        .btn-delete { background: #ff4d4d; color: white; margin-top: 5px; }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .setting-item { display: flex; flex-direction: column; gap: 5px; }
        .setting-item label { font-size: 12px; color: #fca311; }
        input[type="color"] { height: 40px; padding: 2px; cursor: pointer; border: none; width: 100%; background: none; }
    </style>
</head>
<body>

<div class="header">
    <h2>Team Management</h2>
    <div class="header-btns">
        <button class="icon-btn" onclick="window.open('scoreboard.html', '_blank')" title="View Scoreboard">📊️</button>
        <button class="icon-btn" onclick="openThemeModal()" title="Theme Settings">⚙️</button>
    </div>
</div>

<div id="team-container">
    <p style="text-align: center; color: #666;">Loading Teams...</p>
</div>

<div id="teamModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="text-align: center; color: #fca311; margin: 0 0 15px 0;">Edit Team</h3>
        <input type="hidden" id="edit_id">
        <div class="input-row"><label>Name:</label><input type="text" id="team_name"></div>
        
        <div class="input-row">
            <label>Logo URL:</label>
            <div class="upload-container">
                <input type="text" id="url" placeholder="Paste URL or upload">
                <button class="upload-btn" id="upload_trigger" onclick="document.getElementById('file_input').click()" title="Upload Image">📁</button>
                <input type="file" id="file_input" style="display: none;" accept="image/*" onchange="uploadToDiscord(this)">
            </div>
        </div>

        <div class="input-row"><label>Booyah:</label><input type="number" id="booyah"></div>
        <div class="input-row"><label>Kill:</label><input type="number" id="kill"></div>
        <div class="input-row"><label>Point:</label><input type="number" id="point"></div>
        <div class="btn-group">
            <div class="action-btns">
                <button class="btn btn-cancel" onclick="closeModal('teamModal')">Close</button>
                <button class="btn btn-save" onclick="saveTeamData()">Confirm</button>
            </div>
            <button id="deleteBtn" class="btn btn-delete" onclick="deleteCurrentTeam()">REMOVE TEAM</button>
        </div>
    </div>
</div>

<div id="themeModal" class="modal">
    <div class="modal-content">
        <h3 style="text-align: center; color: #fca311; margin: 0 0 15px 0;">Theme Settings</h3>
        <div class="section-title">Header Settings</div>
        <div class="settings-grid">
            <div class="setting-item"><label>BG Color</label><input type="color" id="header_bg"></div>
            <div class="setting-item"><label>Text Color</label><input type="color" id="header_text"></div>
        </div>
        <div class="section-title">List Row Background</div>
        <div class="settings-grid">
            <div class="setting-item"><label>Start/End</label><input type="color" id="list_bg_start"></div>
            <div class="setting-item"><label>Middle</label><input type="color" id="list_bg_end"></div>
        </div>
        <div class="section-title">List Elements</div>
        <div class="settings-grid">
            <div class="setting-item"><label>Rank Color</label><input type="color" id="rank_color"></div>
            <div class="setting-item"><label>Point Color</label><input type="color" id="point_color"></div>
            <div class="setting-item"><label>Text Color</label><input type="color" id="list_text"></div>
            <div class="setting-item"><label>Row Border</label><input type="color" id="list_border"></div>
            <div class="setting-item"><label>Logo Border</label><input type="color" id="logo_border"></div>
        </div>
        <div class="btn-group">
            <div class="action-btns">
                <button class="btn btn-cancel" onclick="closeModal('themeModal')">Cancel</button>
                <button class="btn btn-save" onclick="saveThemeData()">Save Theme</button>
            </div>
        </div>
    </div>
</div>

<div class="fab" onclick="openAddModal()">+</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC2mEZBoiuUuU3e0ymHyRiwHt_xfyBvuAs",
        authDomain: "wisc-e94c6.firebaseapp.com",
        databaseURL: "https://wisc-e94c6-default-rtdb.firebaseio.com",
        projectId: "wisc-e94c6",
        storageBucket: "wisc-e94c6.appspot.com",
        messagingSenderId: "234617788899",
        appId: "1:234617788899:web:f62321e71feddb5f38e8d6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // --- Discord Webhook URL ---
    // এখানে আপনার Discord Webhook URL টি বসান
    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1487139171977138297/p9eFome1HHAO0hgSH4uKlCgbRDL4gQjFJKCuHS-ZrEZTNA6CnktfHt1nDUkoUyfJKMm0"; 

    const defaultLogo = "https://images.seeklogo.com/logo-png/35/1/free-fire-logo-png_seeklogo-354358.png";
    const teamContainer = document.getElementById('team-container');

    // Discord Upload Function
    async function uploadToDiscord(input) {
        const file = input.files[0];
        if (!file) return;

        if (DISCORD_WEBHOOK === "YOUR_DISCORD_WEBHOOK_URL_HERE") {
            alert("Please set your Discord Webhook URL in the code!");
            return;
        }

        const trigger = document.getElementById('upload_trigger');
        const urlInput = document.getElementById('url');
        
        trigger.innerText = "⏳"; // Loading Icon
        trigger.disabled = true;

        const formData = new FormData();
        formData.append("file", file);

        try {
            const response = await fetch(DISCORD_WEBHOOK, {
                method: "POST",
                body: formData
            });

            if (response.ok) {
                const data = await response.json();
                const uploadedUrl = data.attachments[0].url;
                urlInput.value = uploadedUrl;
                alert("Upload Successful!");
            } else {
                alert("Upload failed! Check your Webhook URL.");
            }
        } catch (error) {
            console.error(error);
            alert("Error uploading image.");
        } finally {
            trigger.innerText = "📁";
            trigger.disabled = false;
            input.value = ""; // Clear file input
        }
    }

    // --- Firebase Logic ---
    db.ref('teams').on('value', (snapshot) => {
        let teamsArr = [];
        teamContainer.innerHTML = '';
        snapshot.forEach((child) => { teamsArr.push({ id: child.key, ...child.val() }); });
        teamsArr.sort((a, b) => b.point - a.point);
        
        if (teamsArr.length === 0) {
            teamContainer.innerHTML = '<p style="text-align:center; color:#555;">No teams found.</p>';
            return;
        }

        teamsArr.forEach((team) => {
            const card = document.createElement('div');
            card.className = 'team-card';
            card.onclick = () => openEditModal(team.id, team);
            card.innerHTML = `
                <img src="${team.url || defaultLogo}" onerror="this.src='${defaultLogo}'" alt="logo">
                <div class="team-info">
                    <h3>${team.team_name}</h3>
                    <p>Point: ${team.point} | Kill: ${team.kill} | Booyah: ${team.booyah}</p>
                </div>
            `;
            teamContainer.appendChild(card);
        });
    });

    function openThemeModal() {
        db.ref('theme_settings').once('value', (snapshot) => {
            const c = snapshot.val() || {};
            document.getElementById('header_bg').value = c.header_bg || "#fca311";
            document.getElementById('header_text').value = c.header_text || "#000000";
            document.getElementById('list_bg_start').value = c.list_bg_start || "#1f1d18";
            document.getElementById('list_bg_end').value = c.list_bg_end || "#2a2822";
            document.getElementById('rank_color').value = c.rank_color || "#fca311";
            document.getElementById('point_color').value = c.point_color || "#fca311";
            document.getElementById('list_text').value = c.list_text || "#ffffff";
            document.getElementById('list_border').value = c.list_border || "#444444";
            document.getElementById('logo_border').value = c.logo_border || "#fca311";
            document.getElementById('themeModal').style.display = 'flex';
        });
    }

    function saveThemeData() {
        const theme = {
            header_bg: document.getElementById('header_bg').value,
            header_text: document.getElementById('header_text').value,
            list_bg_start: document.getElementById('list_bg_start').value,
            list_bg_end: document.getElementById('list_bg_end').value,
            rank_color: document.getElementById('rank_color').value,
            point_color: document.getElementById('point_color').value,
            list_text: document.getElementById('list_text').value,
            list_border: document.getElementById('list_border').value,
            logo_border: document.getElementById('logo_border').value
        };
        db.ref('theme_settings').update(theme).then(() => closeModal('themeModal'));
    }

    function openAddModal() {
        document.getElementById('modalTitle').innerText = "Add New Team";
        document.getElementById('edit_id').value = "";
        document.getElementById('team_name').value = "";
        document.getElementById('url').value = "";
        document.getElementById('booyah').value = "0";
        document.getElementById('kill').value = "0";
        document.getElementById('point').value = "0";
        document.getElementById('deleteBtn').style.display = "none";
        document.getElementById('teamModal').style.display = 'flex';
    }

    function openEditModal(id, data) {
        document.getElementById('modalTitle').innerText = "Edit Team Info";
        document.getElementById('edit_id').value = id;
        document.getElementById('team_name').value = data.team_name;
        document.getElementById('url').value = data.url;
        document.getElementById('booyah').value = data.booyah;
        document.getElementById('kill').value = data.kill;
        document.getElementById('point').value = data.point;
        document.getElementById('deleteBtn').style.display = "block";
        document.getElementById('teamModal').style.display = 'flex';
    }

    function saveTeamData() {
        let id = document.getElementById('edit_id').value || "team_" + Date.now();
        const updateData = {
            team_name: document.getElementById('team_name').value,
            url: document.getElementById('url').value,
            booyah: parseInt(document.getElementById('booyah').value) || 0,
            kill: parseInt(document.getElementById('kill').value) || 0,
            point: parseInt(document.getElementById('point').value) || 0
        };
        if(!updateData.team_name) return alert("Enter team name");
        db.ref('teams/' + id).update(updateData).then(() => closeModal('teamModal'));
    }

    function deleteCurrentTeam() {
        const id = document.getElementById('edit_id').value;
        if(id && confirm("Are you sure?")) db.ref('teams/' + id).remove().then(() => closeModal('teamModal'));
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>

</body>
</html>
