<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Control Panel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 🔒 Login Screen Styles */
        #login-screen {
            display: flex; flex-direction: column; height: 100vh;
            justify-content: center; align-items: center; background: #121212;
        }
        .login-box {
            background: #1e1e1e; padding: 40px; border-radius: 15px; text-align: center;
            border: 2px solid #fca311; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 85%; max-width: 320px;
        }
        .login-box h2 { margin-top: 0; color: #fca311; margin-bottom: 10px; font-size: 22px; }
        .login-box p { color: #888; font-size: 13px; margin-bottom: 20px; }
        
        .pass-input {
            width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444;
            border-radius: 5px; color: white; font-size: 16px; text-align: center;
            margin-bottom: 15px; outline: none; box-sizing: border-box;
        }
        .pass-input:focus { border-color: #fca311; }
        
        .login-btn {
            background: #fca311; color: black; font-weight: bold; padding: 12px;
            border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%;
            transition: 0.3s;
        }
        .login-btn:hover { background: #ffb732; }

        /* 📱 Main App Styles */
        #app-container { display: none; padding: 15px; max-width: 800px; margin: 0 auto; }
        
        .header { 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #fca311; padding-bottom: 10px; margin-bottom: 20px;
        }
        .header-btns { display: flex; gap: 15px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #fca311; padding: 5px; transition: 0.2s;}
        .icon-btn:hover { transform: scale(1.1); }

        /* Team Cards & Modals */
        .team-card { background: #1e1e1e; display: flex; align-items: center; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #333; cursor: pointer;}
        .team-card img { width: 40px; height: 40px; border-radius: 5px; margin-right: 12px; }
        .team-info h3 { margin: 0; font-size: 15px; }
        .team-info p { margin: 2px 0 0; font-size: 12px; color: #fca311; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 92%; max-width: 420px; max-height: 90vh; overflow-y: auto; box-sizing: border-box; }
        
        .match-row { display: grid; grid-template-columns: 35px 1fr 1fr 35px; gap: 5px; margin-bottom: 8px; background: #2a2a2a; padding: 8px; border-radius: 5px; align-items: center; }
        .match-input { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #111; color: white; width: 100%; text-align: center; box-sizing: border-box;}
        
        /* 👥 Players Grid */
        #players-section { display: none; margin-bottom: 10px; transition: 0.3s; }
        .players-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .player-input { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 12px; width: 100%; box-sizing: border-box; }

        /* 🎨 Theme Styles */
        .theme-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px; margin-bottom: 5px; border-radius: 5px; }
        .theme-item label { font-size: 13px; color: #ccc; }
        .theme-item input { width: 40px; height: 25px; cursor: pointer; border: none; background: none; }

        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .action-btns { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-save { background: #fca311; color: black; }
        .btn-cancel { background: #444; color: white; }
        .btn-delete { background: #ff4d4d; color: white; }

        .fab { position: fixed; bottom: 25px; right: 25px; width: 55px; height: 55px; background: #fca311; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; color: black; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        .section-label { font-size: 13px; color: #888; margin: 15px 0 8px; border-bottom: 1px solid #333; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .section-label:hover { color: #fca311; }
        .toggle-status { font-size: 10px; background: #333; padding: 2px 6px; border-radius: 3px; color: #fca311; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2>Admin Access</h2>
        <p>Enter password to manage scoreboard</p>
        <input type="password" id="admin_pass" class="pass-input" placeholder="••••••••">
        <button class="login-btn" onclick="verifyPassword()">UNLOCK PANEL</button>
    </div>
</div>

<div id="app-container">
    <div class="header">
        <h2 style="margin:0; font-size: 18px;">Dashboard</h2>
        <div class="header-btns">
            <button class="icon-btn" title="Theme Settings" onclick="openThemeModal()">🎨</button>
            <button class="icon-btn" title="View Scoreboard" onclick="window.open('scoreboard.html', '_blank')">📊</button>
            <button class="icon-btn" title="Point Settings" onclick="openPointModal()">🎯</button>
        </div>
    </div>
    <div id="team-container"></div>
    <div class="fab" onclick="openAddModal()">+</div>
</div>

<div id="teamModal" class="modal"><div class="modal-content">
    <h3 id="modalTitle" style="text-align: center; color: #fca311; margin-top:0;">Edit Team</h3>
    <input type="hidden" id="edit_id">
    
    <div style="margin-bottom:10px;"><label style="font-size:12px; color:#fca311;">Team Name</label><input type="text" id="team_name" class="match-input" style="text-align:left;"></div>
    <div style="margin-bottom:10px;"><label style="font-size:12px; color:#fca311;">Logo URL</label><input type="text" id="url" class="match-input" style="text-align:left;"></div>

    <div class="section-label" onclick="togglePlayerSection()">
        <span>PLAYERS (VERIFICATION)</span>
        <span id="player-toggle-icon" class="toggle-status">SHOW</span>
    </div>
    <div id="players-section">
        <div class="players-grid">
            <input type="text" id="p1" class="player-input" placeholder="Player 1">
            <input type="text" id="p2" class="player-input" placeholder="Player 2">
            <input type="text" id="p3" class="player-input" placeholder="Player 3">
            <input type="text" id="p4" class="player-input" placeholder="Player 4">
            <input type="text" id="p5" class="player-input" placeholder="Player 5">
        </div>
    </div>

    <div class="section-label" style="cursor: default;">
        <span>MATCHES</span>
        <button onclick="addMatch()" style="background:#fca311; border:none; border-radius:3px; padding:3px 8px; font-size:11px; font-weight:bold; cursor:pointer;">+ ADD</button>
    </div>
    <div id="match_container"></div>
    
    <div class="btn-group">
        <div class="action-btns"><button class="btn btn-cancel" onclick="closeModal('teamModal')">Close</button><button class="btn btn-save" onclick="saveTeamData()">Save</button></div>
        <button id="deleteBtn" class="btn btn-delete" onclick="deleteCurrentTeam()">REMOVE TEAM</button>
    </div>
</div></div>

<div id="themeModal" class="modal"><div class="modal-content">
    <h3 style="text-align: center; color: #fca311; margin-top:0;">Theme Settings</h3>
    
    <div class="theme-item"><label>Header Background</label><input type="color" id="header_bg"></div>
    <div class="theme-item"><label>Header Text</label><input type="color" id="header_text"></div>
    <div class="theme-item"><label>List BG (Start)</label><input type="color" id="list_bg_start"></div>
    <div class="theme-item"><label>List BG (End)</label><input type="color" id="list_bg_end"></div>
    <div class="theme-item"><label>List Elements Text</label><input type="color" id="list_text"></div>
    <div class="theme-item"><label>List Border Color</label><input type="color" id="list_border"></div>
    <div class="theme-item"><label>Rank Color</label><input type="color" id="rank_color"></div>
    <div class="theme-item"><label>Point Color</label><input type="color" id="point_color"></div>
    <div class="theme-item"><label>Logo Border Color</label><input type="color" id="logo_border"></div>

    <div class="btn-group" style="margin-top:15px;">
        <div class="action-btns">
            <button class="btn btn-cancel" onclick="closeModal('themeModal')">Cancel</button>
            <button class="btn btn-save" onclick="saveThemeSettings()">Save Theme</button>
        </div>
    </div>
</div></div>

<div id="pointModal" class="modal"><div class="modal-content">
    <h3 style="text-align: center; color: #fca311; margin-top:0;">Point Settings</h3>
    <div id="points_config_container" class="players-grid"></div>
    <div class="btn-group" style="margin-top:15px;"><div class="action-btns"><button class="btn btn-cancel" onclick="closeModal('pointModal')">Cancel</button><button class="btn btn-save" onclick="savePointSettings()">Save Points</button></div></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC2mEZBoiuUuU3e0ymHyRiwHt_xfyBvuAs",
        authDomain: "wisc-e94c6.firebaseapp.com",
        databaseURL: "https://wisc-e94c6-default-rtdb.firebaseio.com",
        projectId: "wisc-e94c6",
        storageBucket: "wisc-e94c6.appspot.com",
        messagingSenderId: "234617788899",
        appId: "1:234617788899:web:f62321e71feddb5f38e8d6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function togglePlayerSection() {
        const section = document.getElementById('players-section');
        const icon = document.getElementById('player-toggle-icon');
        if (section.style.display === "block") {
            section.style.display = "none";
            icon.innerText = "SHOW";
        } else {
            section.style.display = "block";
            icon.innerText = "HIDE";
        }
    }

    function verifyPassword() {
        const input = document.getElementById('admin_pass').value;
        db.ref('admin_settings/password').once('value', (snapshot) => {
            let correctPass = snapshot.val() || "1234";
            if (input === correctPass) { localStorage.setItem('admin_logged_in', 'true'); showApp(); } 
            else { alert("❌ Wrong Password!"); }
        });
    }

    function checkLoginStatus() { if (localStorage.getItem('admin_logged_in') === 'true') { showApp(); } }
    function showApp() { document.getElementById('login-screen').style.display = 'none'; document.getElementById('app-container').style.display = 'block'; loadData(); }

    let pointsTable = {};
    let currentMatches = [];

    function loadData() {
        db.ref('point_settings').on('value', snap => { pointsTable = snap.val() || {}; });
        db.ref('teams').on('value', snap => {
            const container = document.getElementById('team-container');
            container.innerHTML = '';
            let teams = [];
            snap.forEach(c => { teams.push({id: c.key, ...c.val()}); });
            teams.sort((a,b) => b.point - a.point).forEach(t => {
                const div = document.createElement('div');
                div.className = 'team-card';
                div.onclick = () => openEditModal(t.id, t);
                div.innerHTML = `<img src="${t.url||''}"><div class="team-info"><h3>${t.team_name}</h3><p>Points: ${t.point} | Kills: ${t.kill}</p></div>`;
                container.appendChild(div);
            });
        });
    }

    function renderMatches() {
        const con = document.getElementById('match_container');
        con.innerHTML = '';
        currentMatches.forEach((m, i) => {
            con.innerHTML += `<div class="match-row">
                <span style="font-size:12px; color:#fca311;">M${i+1}</span>
                <input type="number" class="match-input" placeholder="Rank" value="${m.placement}" onchange="currentMatches[${i}].placement=this.value">
                <input type="number" class="match-input" placeholder="Kills" value="${m.kill}" onchange="currentMatches[${i}].kill=this.value">
                <button onclick="currentMatches.splice(${i},1);renderMatches()" style="background:none; border:none; color:#ff4d4d; font-weight:bold;">X</button>
            </div>`;
        });
    }

    function addMatch() { currentMatches.push({placement:"", kill:""}); renderMatches(); }

    function saveTeamData() {
        const id = document.getElementById('edit_id').value || "team_" + Date.now();
        const name = document.getElementById('team_name').value;
        if(!name) return alert("Enter Name");

        const players = {
            p1: document.getElementById('p1').value, p2: document.getElementById('p2').value,
            p3: document.getElementById('p3').value, p4: document.getElementById('p4').value,
            p5: document.getElementById('p5').value
        };

        let p=0, k=0, b=0;
        currentMatches.forEach(m => {
            let rank = parseInt(m.placement);
            let kills = parseInt(m.kill) || 0;
            if(rank >= 1 && rank <= 12) p += (pointsTable[rank] || 0);
            if(rank === 1) b++;
            p += kills; k += kills;
        });

        db.ref('teams/'+id).update({
            team_name: name, url: document.getElementById('url').value,
            matches: currentMatches, players: players,
            point: p, kill: k, booyah: b
        }).then(() => closeModal('teamModal'));
    }

    function openThemeModal() {
        db.ref('theme_settings').once('value', (snapshot) => {
            const c = snapshot.val() || {};
            document.getElementById('header_bg').value = c.header_bg || "#fca311";
            document.getElementById('header_text').value = c.header_text || "#111111";
            document.getElementById('list_bg_start').value = c.list_bg_start || "#1f1d18";
            document.getElementById('list_bg_end').value = c.list_bg_end || "#2a2822";
            document.getElementById('list_text').value = c.list_text || "#ffffff";
            document.getElementById('list_border').value = c.list_border || "#444444";
            document.getElementById('rank_color').value = c.rank_color || "#fca311";
            document.getElementById('point_color').value = c.point_color || "#fca311";
            document.getElementById('logo_border').value = c.logo_border || "#fca311";
            document.getElementById('themeModal').style.display = 'flex';
        });
    }

    function saveThemeSettings() {
        const theme = {
            header_bg: document.getElementById('header_bg').value,
            header_text: document.getElementById('header_text').value,
            list_bg_start: document.getElementById('list_bg_start').value,
            list_bg_end: document.getElementById('list_bg_end').value,
            list_text: document.getElementById('list_text').value,
            list_border: document.getElementById('list_border').value,
            rank_color: document.getElementById('rank_color').value,
            point_color: document.getElementById('point_color').value,
            logo_border: document.getElementById('logo_border').value
        };
        db.ref('theme_settings').update(theme).then(() => closeModal('themeModal'));
    }

    function openAddModal() {
        document.getElementById('edit_id').value = "";
        document.getElementById('team_name').value = "";
        document.getElementById('url').value = "";
        document.getElementById('p1').value = ""; document.getElementById('p2').value = "";
        document.getElementById('p3').value = ""; document.getElementById('p4').value = "";
        document.getElementById('p5').value = "";
        document.getElementById('players-section').style.display = "none";
        document.getElementById('player-toggle-icon').innerText = "SHOW";
        currentMatches = []; renderMatches();
        document.getElementById('deleteBtn').style.display='none';
        document.getElementById('teamModal').style.display='flex';
    }

    function openEditModal(id, data) {
        document.getElementById('edit_id').value = id;
        document.getElementById('team_name').value = data.team_name;
        document.getElementById('url').value = data.url;
        const p = data.players || {};
        document.getElementById('p1').value = p.p1 || "";
        document.getElementById('p2').value = p.p2 || "";
        document.getElementById('p3').value = p.p3 || "";
        document.getElementById('p4').value = p.p4 || "";
        document.getElementById('p5').value = p.p5 || "";
        document.getElementById('players-section').style.display = "none";
        document.getElementById('player-toggle-icon').innerText = "SHOW";
        currentMatches = data.matches ? [...data.matches] : [];
        renderMatches();
        document.getElementById('deleteBtn').style.display='block';
        document.getElementById('teamModal').style.display='flex';
    }

    function openPointModal() {
        const con = document.getElementById('points_config_container');
        con.innerHTML = '';
        for(let i=1; i<=12; i++) {
            con.innerHTML += `<div class="point-item"><label style="font-size:12px;">Rank ${i}</label><input type="number" id="pt_${i}" value="${pointsTable[i]||0}"></div>`;
        }
        document.getElementById('pointModal').style.display = 'flex';
    }

    function savePointSettings() {
        let pts = {};
        for(let i=1; i<=12; i++) { pts[i] = parseInt(document.getElementById('pt_'+i).value)||0; }
        db.ref('point_settings').set(pts).then(() => closeModal('pointModal'));
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function deleteCurrentTeam() {
        const id = document.getElementById('edit_id').value;
        if(confirm("Delete this team?")) db.ref('teams/'+id).remove().then(()=>closeModal('teamModal'));
    }

    checkLoginStatus();
</script>
</body>
</html>
